name: Build & package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- .deb (Debian/Ubuntu) and .rpm (Fedora) ----------
  deb-rpm:
    name: Build .deb + .rpm
    # IMPORTANT: build against the OLDEST supported glibc (glibc >= 2.35 =
    # Ubuntu 22.04 / Debian 12 / Fedora 36 floor). Binaries built on newer
    # runners refuse to run on older distros: `version `GLIBC_2.4x' not found`.
    # Everything newer (Ubuntu 24.04, Debian 13, Fedora 40+) runs these fine.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build (release)
        run: cargo build --release --locked

      - name: Prepare desktop file (@BIN@ -> /usr/bin)
        run: |
          mkdir -p target
          sed 's|@BIN@|/usr/bin|g' packaging/rustym.desktop.in > target/rustym.desktop

      # Bundle working copies of yt-dlp + deno into the packages at
      # /usr/lib/rustym/ (the app prefers them over the distro copies).
      # Distro yt-dlp is often years old and gets 403s from YouTube.
      - name: Bundle yt-dlp + deno
        run: |
          mkdir -p packaging/bundled
          curl -fsSL -o packaging/bundled/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -o /tmp/deno.zip -d /tmp/deno-bin
          mv /tmp/deno-bin/deno packaging/bundled/deno
          chmod +x packaging/bundled/yt-dlp packaging/bundled/deno
          packaging/bundled/yt-dlp --version
          packaging/bundled/deno --version

      - name: Build .deb (cargo-deb)
        run: |
          cargo install --locked cargo-deb
          cargo deb --no-build

      - name: Build .rpm (cargo-generate-rpm)
        run: |
          cargo install --locked cargo-generate-rpm
          cargo generate-rpm

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-deb-rpm
          path: dist/*

  # ---------- Arch Linux .pkg.tar.zst ----------
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build + runtime dependencies
        run: |
          # makepkg checks the runtime deps too, so install them as well.
          # unzip: makepkg uses it to extract the bundled deno.zip source.
          pacman -Syu --noconfirm --needed git rust webkit2gtk-4.1 gtk3 pkgconf unzip \
            mpv yt-dlp ffmpeg noto-fonts xdg-utils

      - uses: actions/checkout@v4

      - name: Package with makepkg
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          cp packaging/PKGBUILD .
          # Working copies shipped inside the package (/usr/lib/rustym/).
          YTDLP_URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip"

          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # Not a tag: build from this checkout. Pack the checkout into a
            # source tarball with the same top-level layout makepkg expects
            # (rustym-$VER/), and let makepkg fetch yt-dlp + deno itself.
            # The tarball is written outside the tree and moved in afterwards:
            # tar reads '.', so a growing file inside it aborts with
            # "file changed as we read it".
            tar --exclude=./target --exclude=./dist --exclude=./.git \
                --exclude=./packaging/bundled --exclude=./rustym-$VER.tar.gz \
                --transform "s,^\./,rustym-$VER/," -czf /tmp/rustym-$VER.tar.gz .
            mv /tmp/rustym-$VER.tar.gz .
            APP_SRC="rustym-$VER.tar.gz"
          else
            # Tag build: point PKGBUILD at the tarball of the pushed tag itself.
            # The tag name need not match Cargo.toml's version (e.g. v0.0.2 while
            # the crate was 0.4.0), and GitHub tag tarballs extract as
            # <repo>-<tag-without-v>, so align pkgver with the tag for _srcdir().
            TAGVER="${GITHUB_REF_NAME#v}"
            sed -i "s/^pkgver=.*/pkgver=$TAGVER/" PKGBUILD
            APP_SRC="rustym-$TAGVER.tar.gz::$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          fi
          # Rewrite the source array (it may span several lines) and checksums.
          export APP_SRC YTDLP_URL DENO_URL
          python3 - <<'PYEOF'
          import os, re
          s = open("PKGBUILD").read()
          src = 'source=("{}" "yt-dlp::{}" "deno.zip::{}")\n'.format(
              os.environ["APP_SRC"], os.environ["YTDLP_URL"], os.environ["DENO_URL"])
          s, n = re.subn(r'source=\([^)]*\)\n', src, s, count=1)
          assert n == 1, "source array not found in PKGBUILD"
          s, n = re.subn(r"sha256sums=\([^)]*\)", "sha256sums=('SKIP' 'SKIP' 'SKIP')", s, count=1)
          assert n == 1, "sha256sums not found in PKGBUILD"
          open("PKGBUILD", "w").write(s)
          PYEOF
          grep '^source=' PKGBUILD

          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"
          mkdir -p dist
          cp rustym-*.pkg.tar.zst dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-arch
          path: dist/*

  # ---------- Attach packages to a GitHub release on tag push ----------
  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-rpm, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      # Publish the release with the packages attached. Two situations are
      # handled:
      #  - no release yet: create it. If releases/v<TAG>.md exists in the repo
      #    it is used as the notes, otherwise GitHub's auto-generated notes.
      #  - the release already exists (created manually beforehand, e.g. a
      #    draft): `gh release create` would fail, so fall back to replacing
      #    the assets with --clobber and keep the existing notes.
      - name: Create or update release
        run: |
          ls -l dist/
          NOTES="--generate-notes"
          if [ -f "releases/$GITHUB_REF_NAME.md" ]; then
            NOTES="--notes-file=releases/$GITHUB_REF_NAME.md"
            echo "Using pre-written release notes from releases/$GITHUB_REF_NAME.md"
          fi
          if gh release create "$GITHUB_REF_NAME" dist/* \
               --title "Rustym $GITHUB_REF_NAME" $NOTES; then
            echo "Release created with $(ls dist | wc -l) assets"
          else
            echo "Release already exists - replacing its assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          fi
          gh release view "$GITHUB_REF_NAME" \
            --json assets --jq '[.assets[].name]'
        env:
          GH_TOKEN: ${{ github.token }}
