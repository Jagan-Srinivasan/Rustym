name: Build & package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- .deb (Debian/Ubuntu) and .rpm (Fedora) ----------
  deb-rpm:
    name: Build .deb + .rpm
    # IMPORTANT: build against the OLDEST supported glibc (glibc >= 2.35 =
    # Ubuntu 22.04 / Debian 12 / Fedora 36 floor). Binaries built on newer
    # runners refuse to run on older distros: `version `GLIBC_2.4x' not found`.
    # Everything newer (Ubuntu 24.04, Debian 13, Fedora 40+) runs these fine.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build (release)
        run: cargo build --release --locked

      - name: Prepare desktop file (@BIN@ -> /usr/bin)
        run: |
          mkdir -p target
          sed 's|@BIN@|/usr/bin|g' packaging/rustym.desktop.in > target/rustym.desktop

      - name: Build .deb (cargo-deb)
        run: |
          cargo install --locked cargo-deb
          cargo deb --no-build

      - name: Build .rpm (cargo-generate-rpm)
        run: |
          cargo install --locked cargo-generate-rpm
          cargo generate-rpm

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-deb-rpm
          path: dist/*

  # ---------- Arch Linux .pkg.tar.zst ----------
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build + runtime dependencies
        run: |
          # makepkg checks the runtime deps too, so install them as well
          pacman -Syu --noconfirm --needed git rust webkit2gtk-4.1 gtk3 pkgconf \
            mpv yt-dlp ffmpeg noto-fonts xdg-utils

      - uses: actions/checkout@v4

      - name: Package with makepkg
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          cp packaging/PKGBUILD .

          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # Not a tag: build from this checkout instead of the tag tarball
            sed -i 's|^source=.*|source=()|; s|^sha256sums=.*|sha256sums=()|' PKGBUILD
            mkdir -p src/rustym-$VER
            tar --exclude=./target --exclude=./dist --exclude=./.git \
                --exclude=./src/rustym-$VER -cf - . | tar -xf - -C src/rustym-$VER
          else
            # Tag build: point PKGBUILD at the tarball of the pushed tag itself.
            # The tag name need not match Cargo.toml's version (e.g. v0.0.2 while
            # the crate is 0.4.0), and GitHub tag tarballs extract as
            # <repo>-<tag-without-v>, so align pkgver with the tag for _srcdir().
            TAGVER="${GITHUB_REF_NAME#v}"
            sed -i "s/^pkgver=.*/pkgver=$TAGVER/" PKGBUILD
            sed -i "s|^source=.*|source=(\"$pkgname-$TAGVER.tar.gz::$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz\")|" PKGBUILD
            sed -i "s|^sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          fi

          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"
          mkdir -p dist
          cp rustym-*.pkg.tar.zst dist/
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-arch
          path: dist/*

  # ---------- Attach packages to a GitHub release on tag push ----------
  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-rpm, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Create release
        run: |
          ls -l dist/
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Rustym $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
