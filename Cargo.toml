[package]
name = "rustym"
version = "0.3.0"
edition = "2021"
description = "Rustym - a simple, ad-free YouTube Music player for Linux"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = "0.2.2"

[profile.release]
opt-level = 3
lto = true
strip = true
