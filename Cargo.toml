[package]
name = "rustym"
version = "0.0.7"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Jagan-Srinivasan/Rustym"
description = "Rustym - an ad-free, feature-rich YouTube Music player for Linux (pure Rust + egui)"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = "0.2.2"
# native YouTube Music client + lyrics (blocking HTTP, rustls)
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
rand = "0.8"
# media keys / MPRIS "now playing" (disable with --no-default-features if it will not build)
souvlaki = { version = "0.7", optional = true }

# in-app Google sign-in window (needs webkit2gtk-4.1 + gtk3 installed); builds the `rustym-login` helper
wry = { version = "0.47", optional = true }
tao = { version = "0.30", optional = true }

# malloc_trim: give freed allocator pages back to the OS so the RSS stays low.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = ["mpris", "webview-login"]
mpris = ["dep:souvlaki"]
webview-login = ["dep:wry", "dep:tao"]

[package.metadata.deb]
maintainer = "Jagan Srinivasan <jaganrmkcet@gmail.com>"
copyright = "Jagan Srinivasan"
extended-description = """\
Rustym is a native desktop YouTube Music player built with egui on top of
mpv and yt-dlp. Search, playlists, library, synced lyrics, equalizer,
visualiser, tray and MPRIS support. Unofficial client, not affiliated
with Google or YouTube."""
# $auto adds the shared-library deps detected from the built binaries.
# yt-dlp and deno are NOT system deps: current copies are bundled into
# /usr/lib/rustym/ by CI, and the app can update them from the Settings page.
depends = "$auto, mpv, ffmpeg, xdg-utils, libgtk-3-0, libwebkit2gtk-4.1-0"
recommends = "fonts-noto-core"
section = "sound"
priority = "optional"
maintainer-scripts = "packaging/deb"
assets = [
    ["target/release/rustym", "usr/bin/", "755"],
    ["target/release/rustym-login", "usr/bin/", "755"],
    ["target/rustym.desktop", "usr/share/applications/", "644"],
    ["packaging/rustym.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    # Raster icons: some StatusNotifier tray hosts cannot load the scalable SVG.
    ["packaging/icons/rustym.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/rustym-64.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    # Working copies of the tools YouTube needs, pinned at build time by CI
    # (see .github/workflows/build.yml). Engine code puts /usr/lib/rustym
    # first on PATH, so these beat any distro yt-dlp/deno.
    ["packaging/bundled/yt-dlp", "usr/lib/rustym/", "755"],
    ["packaging/bundled/deno", "usr/lib/rustym/", "755"],
]

[package.metadata.generate-rpm]
summary = "Ad-free, feature-rich YouTube Music player for Linux"
license = "GPL-3.0-only"
group = "Applications/Multimedia"
release = 1
# Fedora package names
requires = { mpv = "*", ffmpeg-free = "*", gtk3 = "*", "webkit2gtk4.1" = "*", xdg-utils = "*" }
assets = [
    { source = "target/release/rustym", dest = "/usr/bin/rustym", mode = "755" },
    { source = "target/release/rustym-login", dest = "/usr/bin/rustym-login", mode = "755" },
    { source = "target/rustym.desktop", dest = "/usr/share/applications/rustym.desktop", mode = "644" },
    { source = "packaging/rustym.svg", dest = "/usr/share/icons/hicolor/scalable/apps/rustym.svg", mode = "644" },
    # Raster icons: some StatusNotifier tray hosts cannot load the scalable SVG.
    { source = "packaging/icons/rustym.png", dest = "/usr/share/icons/hicolor/128x128/apps/rustym.png", mode = "644" },
    { source = "packaging/icons/rustym-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/rustym.png", mode = "644" },
    # See the .deb note above.
    { source = "packaging/bundled/yt-dlp", dest = "/usr/lib/rustym/yt-dlp", mode = "755" },
    { source = "packaging/bundled/deno", dest = "/usr/lib/rustym/deno", mode = "755" },
]

[[bin]]
name = "rustym"
path = "src/main.rs"

[[bin]]
name = "rustym-login"
path = "src/bin/rustym-login.rs"
required-features = ["webview-login"]

[profile.release]
opt-level = 3
lto = "thin"  # fat LTO breaks ring crate linking with the lld default linker (rustc >= 1.90)
strip = true
